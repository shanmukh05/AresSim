[project]
name = "gym-mars"
version = "0.1.0"
description = "Mars Survival RL Environment - A Gymnasium environment for training autonomous rover agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Shanmukh", email = "shanmukh@example.com"}
]
keywords = ["reinforcement-learning", "gymnasium", "mars", "simulation", "rl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.2.0",
    "tensorboard>=2.15.0",
    "tqdm>=4.64.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "gym-mars[train,dev]",
]

[project.entry-points."gymnasium.envs"]
__root__ = "gym_mars:register_envs"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gym_mars*"]
