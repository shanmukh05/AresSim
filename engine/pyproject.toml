[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aresim"
version = "0.1.0"
description = "Deterministic AresSim gameplay engine and local UI API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
aresim-rl = "aresim.training.cli:main"

[project.optional-dependencies]
env = [
  "numpy>=2,<3",
  "gymnasium>=1.2.2,<2",
  "pettingzoo>=1.26,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]
notebook = [
  "ipykernel>=7,<8",
  "matplotlib>=3.10,<4",
  "nbclient>=0.11,<1",
  "nbformat>=5.10,<6",
  "pandas>=2.3,<4",
]
rllib = [
  "gymnasium==1.2.2",
  "matplotlib>=3.10,<4",
  "numpy>=2,<3",
  "pandas>=2.3,<4",
  "pettingzoo>=1.26,<2",
  "PyYAML>=6.0.3,<7",
  "ray[rllib,tune]>=2.58,<2.59",
  "torch>=2.13,<2.14",
  "wandb>=0.29,<0.30",
]

[tool.setuptools.packages.find]
include = ["aresim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rllib_slow: starts local Ray workers and performs a real learner update",
]
