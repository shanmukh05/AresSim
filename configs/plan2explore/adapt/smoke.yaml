  initialization_checkpoint: null
  ensemble_size: 5
  intrinsic_scale: 1.0
model_config:
  terrain_embedding: 4
  objective_embedding: 4
  conv_channels:
  - 8
  - 16
  telemetry_layers:
  - 32
  - 32
  fused_width: 64
  deterministic_size: 64
  stochastic_size: 8
  categories: 8
  hidden_size: 64
  unimix: 0.01
  value_bins: 255
