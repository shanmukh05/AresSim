  seed_manifest: configs/seeds/phase1_smoke_eval_v1.yaml
  split: validation
  record_trajectories: false
  workers: 1
checkpoint:
  interval_environment_steps: 128
  keep: 1
tracking:
  mode: disabled
  project: aresim
  group: plan2explore
  tags:
  - smoke
  - plan2explore
  - adapt
artifacts:
  root: results
  reject_existing: true
  resume_from: null
resources:
  device: cpu
  torch_threads: 1
  num_collectors: 1
  num_envs_per_collector: 1
  collection_steps_per_env: 32
  collector_torch_threads: 1
