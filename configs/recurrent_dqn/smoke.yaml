schema_version: aresim.experiment.v1
experiment_id: recurrent_dqn_smoke_v1
trial_id: seed_7
algorithm: recurrent_dqn
model: local_cnn_lstm_q
learner_seed: 7
environment:
  scenario_id: phase1_default_v1
  observation: local_memory
  action: discrete
  reward: shaped_train
  task: resource_mission
  max_episode_steps: 16
  reward_overrides:
    time_cost: -0.025
    samples_collected: 0.3
algorithm_config:
  total_environment_steps: 512
  rollout_batch_size: 64
  rollout_fragment_length: 16
  training_intensity: 4.0
  train_batch_size: 16
  replay_capacity: 1024
  learning_starts: 32
  n_step: 3
  double_q: true
  dueling: true
  gamma: 0.995
  learning_rate: 0.0001
  max_gradient_norm: 40.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_timesteps: 256
  target_network_update_freq: 64
  tau: 1.0
  sequence_length: 8
  burn_in_length: 2
model_config:
  terrain_embedding: 4
  objective_embedding: 4
  conv_channels:
  - 8
  - 16
  telemetry_layers:
  - 32
  - 32
  fused_width: 64
  lstm_hidden_size: 64
evaluation:
  seed_manifest: configs/seeds/phase1_smoke_eval_v1.yaml
  split: validation
  record_trajectories: false
  workers: 1
checkpoint:
  interval_environment_steps: 256
  keep: 1
tracking:
  mode: disabled
  project: aresim
  group: recurrent_dqn
  tags:
  - smoke
  - recurrent_dqn
artifacts:
  root: results
  reject_existing: true
  resume_from: null
resources:
  num_env_runners: 0
  num_envs_per_env_runner: 1
  num_learners: 0
  cpus_per_env_runner: 1
  gpus_per_learner: 0.0
