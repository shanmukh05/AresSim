  max_gradient_norm: 0.5
  target_kl: 0.02
evaluation:
  seed_manifest: notebooks/phase1_open_exploration_split_v1.yaml
  interval_environment_steps: 81920
  split: validation
  record_trajectories: false
checkpoint:
  interval_environment_steps: 81920
  keep: 3
tracking:
  mode: online
  project: aresim
  group: reference
  tags: [reference, explore, gpu, goal_potential]
artifacts:
  root: results
  reject_existing: true
resources:
  num_env_runners: 28
  num_envs_per_env_runner: 1
  num_learners: 0
  cpus_per_env_runner: 1
  gpus_per_learner: 1.0
