schema_version: aresim.experiment.v1
experiment_id: rllib_masked_ppo_reference
trial_id: seed_25
algorithm: masked_ppo
model: local_cnn_actor_critic
learner_seed: 25
environment:
  scenario_id: phase1_default_v1
  observation: local
  action: discrete
  reward: shaped_train
  task: resource_mission
  max_episode_steps: 800
algorithm_config:
  total_environment_steps: 2097152
  rollout_batch_size: 8192
  minibatch_size: 512
  update_epochs: 2
  gamma: 0.995
  gae_lambda: 0.95
  clip_param: 0.2
