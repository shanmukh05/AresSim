# Last saved checkpoint of every PPO trial under results/ppo.
# final is the end-of-training export. seed_9 never wrote one, so this uses its newest step.
schema_version: aresim.evaluation.panel.v1
output: results/reports/ppo_last_checkpoints_20
seed_manifest: configs/seeds/phase1_open_exploration_split_v1.yaml
split: validation
episode_count: 20
action_mode: deterministic
workers: 4
allow_environment_mismatch: true
checkpoints:
  - name: PPO seed_7
    path: results/ppo/seed_7/checkpoints/final/checkpoint.json
