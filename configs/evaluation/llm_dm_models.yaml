# Historical report recipe. The LLM-only raw runs were removed after the aggregate reports were saved.
# Use scripts/run_llm_dm_ablation.sh for the Decision Model / Learner study.
# Actor and learner must match the manifest stored in each run.
schema_version: aresim.llm_dm.model_panel.v1
experiment_name: llm-actor-learner-5-games
output_directory: results/reports/llm_dm/llm-actor-learner-5-games-eval
runs:
  - name: GPT-6 Luna
    path: results/reports/llm_dm/llm-actor-learner-5-games/runs/openai-gpt-6-luna
    actor:
      provider: openai
      model: gpt-6-luna
      generation:
        reasoning:
          effort: none
    learner:
      provider: openai
      model: gpt-6-luna
      generation:
        reasoning:
          effort: high
  - name: DeepSeek Flash
    path: results/reports/llm_dm/llm-actor-learner-5-games/runs/deepseek-deepseek-flash
    actor:
      provider: deepseek
      model: deepseek-flash
      generation:
        reasoning:
          effort: none
    learner:
      provider: deepseek
      model: deepseek-flash
      generation:
        reasoning:
          effort: high
  - name: Gemini 3.8 Flash
    path: results/reports/llm_dm/llm-actor-learner-5-games/runs/gemini-gemini-3-8-flash
    actor:
      provider: gemini
      model: gemini-3.8-flash
      generation: {}
    learner:
      provider: gemini
      model: gemini-3.8-flash
      generation: {}
