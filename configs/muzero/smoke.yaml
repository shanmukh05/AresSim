schema_version: aresim.experiment.v1
experiment_id: muzero_smoke_v2
trial_id: seed_7
algorithm: muzero
model: local_muzero
learner_seed: 7
environment:
  scenario_id: phase1_default_v1
  observation: local_memory
  action: discrete
  reward: shaped_train
  task: open_exploration
  max_episode_steps: 16
algorithm_config:
  total_environment_steps: 64
  rollout_batch_size: 16
  simulations: 2
  evaluation_simulations: 2
  unroll_steps: 2
