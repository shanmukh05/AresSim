  collector_torch_threads: 1
  max_policy_lag_updates: 32
evaluation:
  seed_manifest: configs/seeds/phase1_smoke_eval_v1.yaml
  split: validation
  record_trajectories: false
checkpoint:
  interval_environment_steps: 32
  keep: 1
tracking:
  mode: disabled
  project: aresim
  tags: [smoke, muzero]
artifacts:
